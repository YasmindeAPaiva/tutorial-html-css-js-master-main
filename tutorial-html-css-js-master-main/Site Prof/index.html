<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IF Investments</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js"></script>
    </head>
    <body>

        <header>
            <div class="wrapper">
                <div id="logo">
                    <img src="/tutorial-html-css-js-master-main/Site Prof/pig.svg" alt="Logo IF Investments">
                    <h1>IF <span>Investments</span></h1>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html" class="active">Home</a></li>
                        <li><a href="bolsas.html">Bolsas</a></li>
                        <li><a href="cadastro.html">Cadastro</a></li>
                        <li><button onclick="">+ add</button></li>

                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <div class="wrapper">
                <h1>IF Investiments</h1>
            </div>
        </main>
        <footer>
            <div class="wrapper">
            </div>
        </footer>
        <div class="modal" id="addStockModal">
            <main>
                <h2>Adicionar Ação</h2>
                <form id="addStockForm">
                    <label for=" stockTicker">Símbolo:</label>
                    <input type="text" id="stockTicker" name="stockTicker">

                    <label for="stockName">Nome da Ação:</label>
                    <input type="text" id="stockName" name="stockName">

                    <label for="stockPrice">Preço da Ação:</label>
                    <input type="number" id="stockPrice" name="stockPrice">

                    <label for="stockQuantity">Quantidade:</label>
                    <input type="number" id="stockQuantity" name="stockQuantity">

                    <input type="submit" value="Adicionar">
                </form>
            </main>
        </div>
    </body>
